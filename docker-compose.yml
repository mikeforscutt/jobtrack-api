services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mikeforscutt
      POSTGRES_DB: jobtrack
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - ./init-db:/docker-entrypoint-initdb.d

  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://mikeforscutt@db:5432/jobtrack
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      - db